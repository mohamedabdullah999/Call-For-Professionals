# Call For Professional Speakers → https://global.expertslive.sa/speakerreg
# Paste inside the existing `server { ... }` block for global.expertslive.sa (the HTTPS one), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The path is passed through unchanged (no URI on proxy_pass): the app is built with
# basePath /speakerreg and expects /speakerreg/... itself.
location /speakerreg {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The app reads the last entry, the one nginx appends (TRUSTED_PROXY_HOPS=1)
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The form body is limited to 10 KB by the app; 1 MB is plenty
    client_max_body_size 1m;
}
